name: Fetch catalysts & enrich drugs

on:
  schedule:
    # 06:00 and 18:00 UTC, daily
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-catalysts
  cancel-in-progress: false

jobs:
  fetch-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Both scripts use only the Python standard library -- nothing to install.

      - name: Fetch Phase 3 catalysts (ClinicalTrials.gov + SEC EDGAR)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'set-me@example.com' }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
        run: python3 scripts/fetch_catalysts.py

      - name: Enrich new/changed drugs (PubChem, RxNorm, ChEMBL, openFDA, DailyMed, PubMed, MedlinePlus)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'set-me@example.com' }}
          # Optional free registered keys for higher rate limits -- unset is fine.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          MAX_DRUGS_PER_RUN: ${{ vars.MAX_DRUGS_PER_RUN || '40' }}
        run: python3 scripts/enrich_drugs.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update catalyst and drug data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
