name: Fetch catalysts & enrich drugs

on:
  schedule:
    # 5 runs back-to-back, 30 min apart, targeting 3:00am-5:00am US Eastern.
    # Cron is fixed UTC and doesn't shift with DST: these UTC times land on
    # 3-5am during Eastern Daylight Time (roughly Mar-Nov, UTC-4, in effect
    # now); during Eastern Standard Time (UTC-5) they land an hour earlier,
    # 2-4am ET. The concurrency group below serializes these regardless --
    # if one run is still going when the next is due, the next just waits.
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-catalysts
  cancel-in-progress: false

jobs:
  fetch-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Both scripts use only the Python standard library -- nothing to install.

      - name: Fetch Phase 3 catalysts (ClinicalTrials.gov + SEC EDGAR)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'set-me@example.com' }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT || format('biotech-phase3-catalyst-tracker {0}', vars.CONTACT_EMAIL || 'set-me@example.com') }}
          FETCH_SLEEP_SECONDS: ${{ vars.FETCH_SLEEP_SECONDS || '0.2' }}
        run: python3 scripts/fetch_catalysts.py

      - name: Enrich new/changed drugs (PubChem, RxNorm, ChEMBL, openFDA, DailyMed, PubMed, MedlinePlus)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'set-me@example.com' }}
          # Optional free registered keys for higher rate limits -- unset is fine.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          MAX_DRUGS_PER_RUN: ${{ vars.MAX_DRUGS_PER_RUN || '80' }}
          ENRICH_SLEEP_SECONDS: ${{ vars.ENRICH_SLEEP_SECONDS || '0.2' }}
        run: python3 scripts/enrich_drugs.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update catalyst and drug data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest ${{ github.ref_name }} and retrying..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort
              echo "Rebase failed; giving up."
              exit 1
            fi
            sleep 3
          done
          echo "Failed to push after retries."
          exit 1
